[package]
name = "nextbot-creator"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A portable Windows GUI for creating DRGBase NextBots for Garry's Mod"
build = "build.rs"

[dependencies]
eframe = { version = "0.34.1", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tga", "webp"] }
rfd = { version = "0.17.2", default-features = false, features = ["common-controls-v6"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
vtf = "0.4.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[build-dependencies]
ico = "0.5"
png = "0.18"
winres = "0.1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
